services:
  mysql:
    image: mysql:8.0
    container_name: incidencias_mysql
    restart: always
    environment:
      MYSQL_DATABASE: incidencias_db
      MYSQL_USER: sanic_user
      MYSQL_PASSWORD: sanic_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database.sql:/docker-entrypoint-initdb.d/database.sql

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: incidencias_phpmyadmin
    restart: always
    depends_on:
      - mysql
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    ports:
      - "8080:80"

volumes:
  mysql_data: